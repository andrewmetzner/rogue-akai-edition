<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RogueLike</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a0a;
        color: #ccc;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        user-select: none;
      }
      #game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      #canvas {
        display: block;
        image-rendering: pixelated;
      }
      #hud {
        width: 100%;
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: #aaa;
        padding: 0 4px;
      }
      #log {
        width: 100%;
        height: 64px;
        overflow: hidden;
        font-size: 12px;
        color: #888;
        padding: 0 4px;
        display: flex;
        flex-direction: column-reverse;
      }
      .log-line { line-height: 1.4; }
      .log-line.new { color: #ddd; }
      #mobile-block {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 16px;
        color: #aaa;
        font-family: monospace;
        text-align: center;
        padding: 32px;
      }
      #mobile-block .title { font-size: 20px; color: #ddd; }
      #mobile-block .msg { font-size: 14px; line-height: 1.7; color: #888; }
    </style>
  </head>
  <body>
    <div id="mobile-block">
      <div class="title">Rogue Akai Edition</div>
      <div class="msg">
        This game requires a keyboard and is not<br>
        designed for mobile devices.<br><br>
        Please visit on a desktop or laptop.
      </div>
    </div>
    <div id="game-container">
      <div id="hud">
        <span id="hud-left"></span>
        <span id="hud-right"></span>
      </div>
      <canvas id="canvas"></canvas>
      <div id="log"></div>
    </div>
    <script>
      (function () {
        var mobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
          || (navigator.maxTouchPoints > 1 && !/Win/.test(navigator.userAgent));
        if (mobile) {
          document.getElementById('mobile-block').style.display = 'flex';
          document.getElementById('game-container').style.display = 'none';
        }
      })();
    </script>
    <script type="module">
      const mobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints > 1 && !/Win/.test(navigator.userAgent));
      if (!mobile) { import('/src/main.ts'); }
    </script>
  </body>
</html>
